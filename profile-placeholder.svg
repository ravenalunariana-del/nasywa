<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="400" rx="36" fill="url(#bgGrad)"/>
  
  <!-- Outer Orbit Rings -->
  <circle cx="200" cy="190" r="140" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 8"/>
  <circle cx="200" cy="190" r="115" stroke="#C7D2FE" stroke-width="1.5" stroke-dasharray="4 6"/>
  
  <!-- Orbiting Satellite Dot -->
  <circle cx="320" cy="120" r="7" fill="#6366F1"/>
  <circle cx="320" cy="120" r="11" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- Avatar Halo Circle -->
  <circle cx="200" cy="180" r="82" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3"/>
  <circle cx="200" cy="180" r="76" fill="#F1F5F9"/>

  <!-- Avatar Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="155" r="32" fill="url(#avatarGrad)"/>
  <!-- Shoulders / Torso -->
  <path d="M142,235 C142,200 166,192 200,192 C234,192 258,200 258,235 C258,245 250,250 200,250 C150,250 142,245 142,235 Z" fill="url(#avatarGrad)"/>

  <!-- Camera / Upload Badge Icon -->
  <g transform="translate(236, 215)">
    <circle cx="16" cy="16" r="18" fill="#FFFFFF" stroke="#E0E7FF" stroke-width="2"/>
    <circle cx="16" cy="16" r="14" fill="#6366F1"/>
    <!-- Camera icon inside -->
    <path d="M10,13 L12,11 L20,11 L22,13 L24,13 C25.1,13 26,13.9 26,15 L26,21 C26,22.1 25.1,23 24,23 L8,23 C6.9,23 6,22.1 6,21 L6,15 C6,13.9 6.9,13 8,13 L10,13 Z" fill="#FFFFFF"/>
    <circle cx="16" cy="18" r="3" fill="#6366F1"/>
  </g>

  <!-- Clear Label Text -->
  <text x="200" y="320" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E293B">
    [ FOTO PROFIL ANDA ]
  </text>
  <text x="200" y="342" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748B">
    Klik untuk unggah foto Anda dari perangkat
  </text>
  <text x="200" y="360" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="400" fill="#94A3B8">
    atau simpan file foto Anda sebagai: assets/images/profile.jpg
  </text>

  <!-- Sparkles -->
  <path d="M80,90 L82,96 L88,98 L82,100 L80,106 L78,100 L72,98 L78,96 Z" fill="#FBBF24"/>
  <path d="M330,260 L331,265 L336,266 L331,267 L330,272 L329,267 L324,266 L329,265 Z" fill="#F472B6"/>
</svg>
