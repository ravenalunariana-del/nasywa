<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="mainPlanet" x1="20%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="45%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#F472B6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="smallPlanet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="rocketFlame" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="70%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Soft Aura Glows -->
  <circle cx="260" cy="220" r="140" fill="#E0E7FF" opacity="0.45" filter="url(#softGlow)"/>
  <circle cx="130" cy="110" r="60" fill="#FCE7F3" opacity="0.5" filter="url(#softGlow)"/>

  <!-- Orbital Paths (Concentric dashed orbit lines) -->
  <ellipse cx="260" cy="220" rx="210" ry="110" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 8" transform="rotate(-15 260 220)"/>
  <ellipse cx="260" cy="220" rx="160" ry="80" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4 6" transform="rotate(-15 260 220)"/>
  <ellipse cx="260" cy="220" rx="110" ry="55" stroke="#E0E7FF" stroke-width="1.5" stroke-dasharray="3 5" transform="rotate(-15 260 220)"/>

  <!-- Satellite on Outer Orbit -->
  <g transform="translate(420, 150)">
    <circle cx="0" cy="0" r="5" fill="#6366F1"/>
    <rect x="-8" y="-2" width="16" height="4" rx="2" fill="#818CF8"/>
    <line x1="-12" y1="0" x2="-8" y2="0" stroke="#4F46E5" stroke-width="1.5"/>
    <line x1="8" y1="0" x2="12" y2="0" stroke="#4F46E5" stroke-width="1.5"/>
    <rect x="-16" y="-5" width="4" height="10" rx="1" fill="#38BDF8"/>
    <rect x="12" y="-5" width="4" height="10" rx="1" fill="#38BDF8"/>
  </g>

  <!-- Small Pastel Orange Satellite Planet -->
  <g transform="translate(100, 120)">
    <circle cx="0" cy="0" r="18" fill="url(#smallPlanet)"/>
    <ellipse cx="0" cy="0" rx="25" ry="6" stroke="#FDE047" stroke-width="1.5" stroke-dasharray="3 3" transform="rotate(20)"/>
  </g>

  <!-- Crescent Moon -->
  <path d="M430,70 A24,24 0 0,0 410,105 A22,22 0 1,1 430,70 Z" fill="url(#moonGrad)"/>

  <!-- Main Ringed Planet: Back Ring Half -->
  <ellipse cx="260" cy="220" rx="145" ry="34" stroke="url(#ringGradient)" stroke-width="12" stroke-linecap="round" opacity="0.6" transform="rotate(-22 260 220)"/>

  <!-- Main Planet Body -->
  <circle cx="260" cy="220" r="75" fill="url(#mainPlanet)"/>
  <!-- Planet Surface Contours -->
  <path d="M195,200 C220,185 280,195 325,210 C300,240 240,245 195,200 Z" fill="#FFFFFF" opacity="0.15"/>
  <path d="M210,245 C235,235 285,245 315,255 C295,275 245,280 210,245 Z" fill="#4338CA" opacity="0.15"/>

  <!-- Main Ringed Planet: Front Ring Half -->
  <path d="M125,274 C165,300 355,270 395,166" stroke="url(#ringGradient)" stroke-width="14" stroke-linecap="round"/>

  <!-- Creative Explorer Rocket -->
  <g transform="translate(160, 260) rotate(-45)">
    <!-- Rocket Flame -->
    <path d="M18,50 Q24,78 24,90 Q24,78 30,50 Z" fill="url(#rocketFlame)"/>
    <!-- Left Fin -->
    <path d="M10,40 L2,55 Q12,52 18,48 Z" fill="#F43F5E"/>
    <!-- Right Fin -->
    <path d="M38,40 L46,55 Q36,52 30,48 Z" fill="#F43F5E"/>
    <!-- Center Body -->
    <path d="M12,45 C12,18 24,2 24,2 C24,2 36,18 36,45 Z" fill="url(#rocketBody)"/>
    <!-- Nose Tip -->
    <path d="M19,16 C21,6 24,2 24,2 C24,2 27,6 29,16 Z" fill="#6366F1"/>
    <!-- Porthole Window -->
    <circle cx="24" cy="24" r="6" fill="#38BDF8" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="22" cy="22" r="2" fill="#FFFFFF"/>
    <!-- Stripe -->
    <rect x="14" y="36" width="20" height="3" fill="#6366F1"/>
  </g>

  <!-- Aesthetic Twinkling Stars & Sparkles -->
  <!-- Sparkle 1 -->
  <path d="M90,260 L93,270 L103,273 L93,276 L90,286 L87,276 L77,273 L87,270 Z" fill="#FBBF24"/>
  <!-- Sparkle 2 -->
  <path d="M360,60 L363,70 L373,73 L363,76 L360,86 L357,76 L347,73 L357,70 Z" fill="#818CF8"/>
  <!-- Sparkle 3 -->
  <path d="M470,240 L472,248 L480,250 L472,252 L470,260 L468,252 L460,250 L468,248 Z" fill="#F472B6"/>
  <!-- Sparkle 4 -->
  <path d="M190,70 L191,76 L197,77 L191,78 L190,84 L189,78 L183,77 L189,76 Z" fill="#38BDF8"/>
  <!-- Tiny Stars -->
  <circle cx="80" cy="180" r="2.5" fill="#CBD5E1"/>
  <circle cx="160" cy="90" r="2" fill="#FDE047"/>
  <circle cx="330" cy="130" r="3" fill="#A5B4FC"/>
  <circle cx="460" cy="190" r="2" fill="#F472B6"/>
  <circle cx="230" cy="370" r="2.5" fill="#38BDF8"/>
  <circle cx="390" cy="340" r="3" fill="#FDE047"/>
  <circle cx="310" cy="390" r="2" fill="#94A3B8"/>
  <circle cx="110" cy="350" r="2" fill="#C084FC"/>
</svg>
