<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" fill="none">
  <defs>
    <linearGradient id="envelopeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="satelliteDish" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="capsuleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <filter id="auraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Aura Background -->
  <circle cx="230" cy="190" r="120" fill="#EEF2FF" filter="url(#auraGlow)"/>

  <!-- Orbital Communication Waves (Arcs radiating outward) -->
  <path d="M160,110 A110,110 0 0,1 320,110" stroke="#818CF8" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
  <path d="M185,130 A80,80 0 0,1 295,130" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <path d="M210,150 A50,50 0 0,1 270,150" stroke="#C084FC" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Floating Cosmic Message Envelope with Planetary Wings -->
  <g transform="translate(180, 150)">
    <!-- Planetary Orbit behind envelope -->
    <ellipse cx="50" cy="40" rx="95" ry="24" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" transform="rotate(-12 50 40)"/>
    <circle cx="135" cy="25" r="4" fill="#6366F1"/>

    <!-- Wing Left -->
    <path d="M10,40 Q-30,20 -40,35 Q-25,50 5,48 Z" fill="#E0E7FF" stroke="#C7D2FE" stroke-width="1.5"/>
    <!-- Wing Right -->
    <path d="M90,40 Q130,20 140,35 Q125,50 95,48 Z" fill="#E0E7FF" stroke="#C7D2FE" stroke-width="1.5"/>

    <!-- Envelope Base -->
    <rect x="5" y="15" width="90" height="60" rx="8" fill="url(#envelopeGrad)" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Envelope Flap (folded) -->
    <path d="M5,15 L50,50 L95,15" stroke="#94A3B8" stroke-width="2" fill="none"/>
    <path d="M5,75 L38,42" stroke="#CBD5E1" stroke-width="1.5"/>
    <path d="M95,75 L62,42" stroke="#CBD5E1" stroke-width="1.5"/>
    
    <!-- Cute Wax Seal / Planet Stamp in Center -->
    <circle cx="50" cy="48" r="11" fill="url(#capsuleGrad)"/>
    <ellipse cx="50" cy="48" rx="16" ry="4" stroke="#FFFFFF" stroke-width="1.5" transform="rotate(-20 50 48)"/>
    <circle cx="50" cy="48" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Ground Space Station Satellite Antenna (Bottom Left) -->
  <g transform="translate(70, 240)">
    <!-- Base Pedestal -->
    <rect x="25" y="65" width="30" height="12" rx="3" fill="#94A3B8"/>
    <polygon points="40,25 28,65 52,65" fill="#CBD5E1"/>
    <!-- Dish -->
    <path d="M10,25 Q40,-10 70,25 Q40,15 10,25 Z" fill="url(#satelliteDish)"/>
    <line x1="40" y1="5" x2="52" y2="-12" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="53" cy="-14" r="3" fill="#FDE047"/>
  </g>

  <!-- Small Ringed Planet (Top Right) -->
  <g transform="translate(370, 70)">
    <circle cx="0" cy="0" r="16" fill="#F472B6"/>
    <ellipse cx="0" cy="0" rx="26" ry="6" stroke="#FDE047" stroke-width="2" transform="rotate(-20)"/>
  </g>

  <!-- Crescent Moon (Top Left) -->
  <path d="M60,40 A18,18 0 0,0 45,68 A16,16 0 1,1 60,40 Z" fill="#E2E8F0"/>

  <!-- Sparkles & Stars -->
  <path d="M110,90 L112,96 L118,98 L112,100 L110,106 L108,100 L102,98 L108,96 Z" fill="#FDE047"/>
  <path d="M350,220 L352,228 L360,230 L352,232 L350,240 L348,232 L340,230 L348,228 Z" fill="#818CF8"/>
  <path d="M220,50 L221,55 L226,56 L221,57 L220,62 L219,57 L214,56 L219,55 Z" fill="#38BDF8"/>
  <circle cx="160" cy="270" r="2.5" fill="#94A3B8"/>
  <circle cx="390" cy="160" r="2" fill="#F43F5E"/>
  <circle cx="310" cy="310" r="3" fill="#FBBF24"/>
</svg>
